<meta name="description" content="Подписочные метрики по dbt-витринам: каждая цифра ведёт к модели, тесту и прогону. Analytics Engineer portfolio dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --head:#10231C; --head-2:#183328; --head-ink:#EAF0EC; --head-mute:#9DB3A7;
  --paper:#F4F5F2; --surface:#FFFFFF; --ink:#0F1412; --ink-2:#525A56; --ink-3:#858C88;
  --rule:#E2E5E0; --rule-2:#CDD1CB;
  --s1:#1C7C54; --s2:#C08519; --s3:#A32E3E;
  --s1-soft:#E6F1EB; --s2-soft:#F8EEDD; --s3-soft:#F5E3E5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  font-feature-settings:"tnum" 1,"ss01" 1}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ───────── header ───────── */
header{background:var(--head);color:var(--head-ink);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--s1) 0 34%,var(--s2) 34% 67%,var(--s3) 67% 100%)}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.head-in{display:grid;grid-template-columns:1fr auto;gap:24px 48px;padding:36px 0 34px;align-items:end}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--head-mute);margin:0 0 14px}
h1{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:700;font-size:clamp(30px,4.2vw,50px);
  line-height:1.02;letter-spacing:-.025em;margin:0 0 16px;max-width:15ch}
.lede{margin:0;max-width:62ch;font-size:16px;color:#C9D6CE}
.lede b{color:var(--head-ink);font-weight:600}
.author{text-align:right;font-size:13.5px;color:var(--head-mute);line-height:1.6}
.author b{display:block;color:var(--head-ink);font-weight:600;font-size:15px}
.author .mono{font-size:12px}
.author a{color:var(--head-ink);text-decoration:none;border-bottom:1px solid #3E5A4E}
.author a:hover{border-color:var(--head-ink)}
.lang{display:inline-flex;border:1px solid #3E5A4E;border-radius:6px;overflow:hidden;margin-bottom:12px}
.lang button{padding:5px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--head-mute)}
.lang button[aria-pressed="true"]{background:var(--head-ink);color:var(--head)}
.lang button:not([aria-pressed="true"]):hover{color:var(--head-ink)}
.head-links{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}

/* ───────── layout ───────── */
.body{display:grid;grid-template-columns:232px minmax(0,1fr);gap:56px;padding:40px 0 80px}
aside{position:sticky;top:20px;align-self:start;font-size:13.5px}
aside h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.toc{list-style:none;margin:0 0 26px;padding:0}
.toc li a{display:block;padding:5px 0 5px 14px;text-decoration:none;color:var(--ink-2);border-left:2px solid var(--rule)}
.toc li a:hover{color:var(--ink)}
.toc li a.on{color:var(--ink);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2);background:var(--surface);
  transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.reset{font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;margin-bottom:22px;display:none}
.reset.show{display:inline-block}
.switch{display:flex;align-items:center;gap:10px;color:var(--ink-2);margin-bottom:6px}
.switch .tr{width:32px;height:18px;border-radius:9px;background:var(--rule-2);position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"] .tr{background:var(--s1)}
.switch[aria-pressed="true"] .tr::after{left:16px}
.hint{font-size:12px;color:var(--ink-3);margin:0}

main{min-width:0}
.fstate{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 26px;min-height:22px}
.fstate .n{font-family:var(--mono);color:var(--ink)}
.fstate .tag{background:var(--ink);color:#fff;border-radius:4px;padding:1px 8px;font-size:12px}

.sec{margin-bottom:56px;scroll-margin-top:16px}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.sec-head h2{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:500;white-space:nowrap}
.sec-head .line{flex:1;height:1px;background:var(--rule)}
.sec-head .model{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.sec-head .model b{color:var(--ink-2);font-weight:500}
figure{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:26px 28px 20px}
figcaption h3{font-family:var(--display);font-variation-settings:"wdth" 104;font-weight:600;font-size:21px;letter-spacing:-.012em;margin:0 0 6px}
.sub{margin:0 0 18px;color:var(--ink-2);max-width:70ch}
.chart{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.chart svg{display:block;min-width:860px;width:100%;height:auto}
.scroll-hint{display:none;font-size:12px;color:var(--ink-3);margin:6px 0 0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:12px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.take{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:8px;padding:12px 16px;margin:18px 0 0}
.take .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--s1);padding-top:4px;white-space:nowrap}
.take p{margin:0;font-size:14px}
details.tbl,details.prov{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
details summary{cursor:pointer;font-size:13px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary .chev{width:8px;height:10px;transition:transform .15s}
details[open] summary .chev{transform:rotate(90deg)}
details summary:hover{color:var(--ink)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
td.num,th.num{text-align:right;font-family:var(--mono)}
pre{margin:10px 0 0;background:var(--head);color:#DCE7E0;border-radius:8px;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow-x:auto}
.kw{color:#8FD3B3}.fn{color:#F0C36A}.cm{color:#7E9A8C}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:20px 22px 18px}
.kpi .lab{margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
.kpi .val{margin:0;font-family:var(--display);font-variation-settings:"wdth" 108;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1}
.kpi .val .u{font-size:16px;color:var(--ink-3);margin-left:5px;font-weight:500}
.kpi .note{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.kpi-foot{margin-top:12px}

/* lineage */
.lin{position:relative}
.lin .node{cursor:pointer}
.lin .node rect{fill:var(--surface);stroke:var(--rule-2);transition:stroke .15s,fill .15s}
.lin .node text{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
.lin .node .lay{font-size:10px;fill:var(--ink-3);letter-spacing:.1em}
.lin .node:hover rect{stroke:var(--ink)}
.lin .edge{fill:none;stroke:var(--rule-2);stroke-width:1.5;transition:stroke .15s,opacity .15s}
.lin.focus .edge{opacity:.25}
.lin.focus .node{opacity:.35}
.lin.focus .edge.lit{opacity:1;stroke:var(--s1);stroke-width:2}
.lin.focus .node.lit{opacity:1}
.lin.focus .node.lit rect{stroke:var(--s1);fill:var(--s1-soft)}
.lin .colhead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;fill:var(--ink-3)}
.lin-note{font-size:13px;color:var(--ink-2);margin:14px 0 0}

/* quality */
.qgrid{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.qcard{border:1px solid var(--rule);border-radius:8px;padding:18px 20px}
.qcard .big{font-family:var(--display);font-weight:600;font-size:40px;letter-spacing:-.02em;line-height:1;margin:6px 0 4px}
.qcard .big small{font-size:14px;color:var(--ink-3);font-weight:500;letter-spacing:0;margin-left:6px}
.qcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:6px 0;border-top:1px solid var(--rule)}
.qcard .row .mono{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:0}
.dot.pass{background:var(--s1)}.dot.fail{background:var(--s3)}.dot.warn{background:var(--s2)}
.tests{font-size:13px}
.tests .grp{padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.tests .grp:last-child{border-bottom:0}
.tests .mname{font-family:var(--mono);font-size:12.5px;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between}
.tests .mname span{color:var(--ink-3);font-weight:400}
.tests ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:3px 18px}
.tests li{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tests li .mono{font-size:12px;color:var(--ink);margin-left:4px}
.hist{margin-top:14px}
.hist svg{width:100%;height:auto;display:block}

/* limits & improve */
.note-card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--s2);border-radius:10px;padding:20px 24px;font-size:14.5px}
.note-card p{margin:0 0 10px}
.note-card p:last-child{margin:0}
.note-card .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--s2);display:block;margin-bottom:8px}
.note-card.fixed{border-left-color:var(--s1)}
.note-card.fixed .lbl{color:var(--s1)}
.note-card + .note-card{margin-top:14px}
.improve{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.improve .it{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;font-size:14px}
.improve b{display:block;font-weight:600;margin-bottom:6px}
.improve p{margin:0;color:var(--ink-2)}

footer{border-top:1px solid var(--rule);padding:22px 0 0;font-size:12.5px;color:var(--ink-3)}
footer .mono{font-size:12px}
footer a{color:var(--ink-2)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--head);color:#EAF0EC;font-size:12.5px;line-height:1.45;
  padding:8px 11px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip.on{opacity:1}
#tip b{color:#fff;font-weight:600}
#tip .mono{font-size:12px}

/* responsive */
@media (max-width:1040px){
  .body{grid-template-columns:1fr;gap:0}
  aside{position:static;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:26px}
  .toc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:16px}
  .toc li a{border-left:0;padding:2px 0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .qgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 18px}
  .head-in{grid-template-columns:1fr;gap:18px;padding:28px 0 26px}
  .author{text-align:left}
  .head-links{justify-content:flex-start}
  h1{max-width:none}
  figure{padding:18px 16px 14px}
  .scroll-hint{display:block}
  .improve{grid-template-columns:1fr}
  .kpi .val{font-size:28px}
  pre{font-size:11.5px}
}
@media print{aside,#tip,.lang{display:none} .body{display:block} figure{break-inside:avoid}}
</style>

const monthLong = iso => { const [y,m]=iso.split('-'); return t().month_names[+m-1]+' '+y; };

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

  .replace(/(--.*)$/gm, m=>`<span class="cm">${m}</span>`)
  .replace(/\b(with|select|from|where|group by|order by|case|when|then|else|end|is|null|not|and|or|as|left join|join|on|cross join|filter|over|partition by|distinct|interval|month|between)\b/gi, m=>`<span class="kw">${m}</span>`)
  .replace(/\b(sum|count|avg|round|date_trunc|last_day|coalesce|unnest|range|generate_series|lag|min|max)\b/gi, m=>`<span class="fn">${m}</span>`);

/* ─────────────────────────── state & filters ─────────────────────────── */
const F={plan:new Set(),channel:new Set(),country:new Set()};
const filtered = () => D.subs.filter(s=>(!F.plan.size||F.plan.has(s.plan))&&(!F.channel.size||F.channel.has(s.channel))&&(!F.country.size||F.country.has(s.country)));

/* date helpers on ISO strings: 'YYYY-MM-DD' compares lexicographically */
const MONTHS=[...new Set(D.mrr_monthly.map(r=>r.month))];   // 21 months from the mart
const lastDay = iso => { const y=+iso.slice(0,4), m=+iso.slice(5,7); const d=new Date(Date.UTC(y,m,0)); return d.toISOString().slice(0,10); };
const addMonths = (iso,k) => { const y=+iso.slice(0,4), m=+iso.slice(5,7)-1+k; const d=new Date(Date.UTC(y+Math.floor(m/12),((m%12)+12)%12,1)); return d.toISOString().slice(0,10); };
const monthOf = iso => iso.slice(0,7)+'-01';

/* ─────────────────────────── computations (same rules as the marts) ─────────────────────────── */
function calcKpi(rows){
  const act=rows.filter(s=>s.end===null);
  const mrr=act.reduce((a,s)=>a+s.mrr,0);
  return {total:rows.length,active:act.length,mrr,churn:rows.length?(rows.length-act.length)/rows.length*100:0,arpu:act.length?mrr/act.length:0};
}
function calcMrr(rows){
  return MONTHS.map(m=>{
    const me=lastDay(m), out={month:m,total:0,active:0,newN:0,churned:0,byPlan:{}};
    PLANS.forEach(p=>out.byPlan[p]={mrr:0,active:0});
    rows.forEach(s=>{
      if(s.start<=me && (s.end===null||s.end>me)){out.byPlan[s.plan].mrr+=s.mrr;out.byPlan[s.plan].active++;out.total+=s.mrr;out.active++;}
      if(monthOf(s.start)===m) out.newN++;
      if(s.end!==null && monthOf(s.end)===m) out.churned++;
    });
    return out;
  });
}
function calcCohorts(rows){
  const cohorts=[...new Set(rows.map(s=>monthOf(s.start)))].sort();
  return cohorts.map(c=>{
    const members=rows.filter(s=>monthOf(s.start)===c);
    const ks=[];
    for(let k=0;k<=12;k++){const at=addMonths(c,k);const alive=members.filter(s=>s.end===null||s.end>=at).length;ks.push({k,alive,size:members.length,pct:members.length?alive/members.length*100:0});}
    return {cohort:c,size:members.length,ks};
  });
}
function calcBy(rows,key,order){
  return order.map(v=>{const g=rows.filter(s=>s[key]===v);const ch=g.filter(s=>s.end!==null).length;return {key:v,total:g.length,churned:ch,rate:g.length?ch/g.length*100:0};}).filter(g=>g.total>0);
}

  });
}

const W=860, PL=96, PR=30;
function figure(o){

const prov=(src,sql)=>`<details class="prov" data-sql><summary>${CHEV}<span class="mono">${src}</span></summary><pre>${hl(sql)}</pre></details>`;
function table(head,rows,numCols=[]){

/* ─────────────────────────── SQL shown under blocks ─────────────────────────── */
const SQL={
kpi:`select round(sum(mrr) filter (where end_date is null))      as mrr_active,
       count(*) filter (where end_date is null)              as active_subs,
       count(*)                                              as total_subs,
       round(avg(mrr) filter (where end_date is null), 1)    as arpu
from fct_subscriptions`,
mrr:`-- mart_mrr_monthly: month-end balance, not "started this month"
with months as (
    select unnest(generate_series(date '2023-01-01', date '2024-09-01', interval 1 month))::date as month
),
grid as (select m.month, p.plan, last_day(m.month) as month_end
         from months m cross join (select distinct plan from fct_subscriptions) p)
select g.month, g.plan,
       count(s.subscription_id) filter (where s.start_date <= g.month_end
             and (s.end_date is null or s.end_date > g.month_end))          as active_subs,
       coalesce(sum(s.mrr) filter (where s.start_date <= g.month_end
             and (s.end_date is null or s.end_date > g.month_end)), 0)      as mrr,
       count(s.subscription_id) filter (where date_trunc('month', s.start_date) = g.month) as new_subs,
       count(s.subscription_id) filter (where date_trunc('month', s.end_date) = g.month)   as churned_subs
from grid g left join fct_subscriptions s on s.plan = g.plan
group by 1, 2 order by 1, 2`,
cohort:`-- mart_cohort_retention: survival by start-month cohort
with subs as (select date_trunc('month', start_date)::date as cohort_month, start_date, end_date
              from fct_subscriptions),
k as (select unnest(range(0, 13)) as month_num),
grid as (select s.cohort_month, k.month_num,
                s.cohort_month + (k.month_num * interval 1 month) as at_month, s.end_date
         from subs s cross join k)
select cohort_month, month_num, count(*) as cohort_size,
       count(*) filter (where end_date is null or end_date >= at_month) as active_subs,
       round(active_subs * 100.0 / cohort_size, 2) as retention_pct
from grid group by 1, 2 order by 1, 2

-- tests/assert_retention_monotonic.sql: rows returned = failure
select * from (select cohort_month, month_num, retention_pct,
       lag(retention_pct) over (partition by cohort_month order by month_num) as prev_pct
  from mart_cohort_retention)
where prev_pct is not null and retention_pct > prev_pct`,
plan:`select plan,
       count(*)                                        as total_subs,
       count(*) filter (where is_churned)              as churned_subs,
       round(100.0 * count(*) filter (where is_churned) / count(*), 1) as churn_pct
from fct_subscriptions
group by 1 order by churn_pct desc`,
channel:`select channel,
       count(*)                                                as users,
       count(*) filter (where sub_status = 'churned')          as churned,
       round(100.0 * count(*) filter (where sub_status = 'churned') / count(*), 1) as churn_pct
from dim_subscribers
group by 1 order by churn_pct desc`,
ltv:`-- mart_ltv
select plan, count(*) as subscribers, avg(mrr) as avg_mrr,
       avg(lifetime_months) as avg_lifetime_months,
       avg(realized_ltv)    as avg_historical_ltv,
       avg(mrr) / (count(*) filter (where is_churned) * 1.0 / sum(lifetime_months)) as predictive_ltv
from fct_subscriptions group by 1`,
rfm:`-- mart_rfm_segments (per user), then counted per segment
select segment, count(*) as users
from mart_rfm_segments
group by 1 order by 2 desc`
};

function chartKpi(rows){
  const k=calcKpi(rows), L=t().kpi;
  const cards=[
    {lab:L.mrr,val:nf(k.mrr),u:"$",note:L.mrr_n(k.active,k.total)},
    {lab:L.active,val:nf(k.active),u:"",note:L.active_n},
    {lab:L.churn,val:pf(k.churn).replace('%',''),u:"%",note:L.churn_n},

    <div class="kpis">${cards.map(c=>`<div class="kpi"><p class="lab">${c.lab}</p><p class="val">${c.val}<span class="u">${c.u}</span></p><p class="note">${c.note}</p></div>`).join("")}</div>
    <div class="kpi-foot">${prov("fct_subscriptions · mrr, end_date",SQL.kpi)}</div>
  </section>`;
}

function chartMrr(rows){
  const d=calcMrr(rows), L=t().mrr;
  const H=330,PT=16,PB=40,iw=W-PL-PR,ih=H-PT-PB;
  const max=Math.max(24000,Math.ceil(Math.max(...d.map(m=>m.total))/4000)*4000);
  const bw=iw/d.length, barW=Math.min(26,bw*0.62);
  const x=i=>PL+bw*i+(bw-barW)/2, y=v=>PT+ih-(v/max)*ih;
  let g="";
  for(let v=0;v<=max;v+=4000){g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="${C.rule}"/>
    <text x="${PL-14}" y="${y(v)+4}" text-anchor="end" font-size="11.5" font-family="IBM Plex Mono" fill="${C.ink3}">${v?nf(v/1000)+"k":"0"}</text>`;}
  let bars="";
  d.forEach((m,i)=>{
    let acc=0; const order=[...PLANS].reverse(); // basic at the bottom, enterprise on top
    const tipRows=PLANS.map(p=>`<span style="color:${PLAN_COLOR[p]}">■</span> ${p} <span class="mono">${nf(m.byPlan[p].mrr)}</span><br>`).join("");
    const tipHtml=t().tip_mrr(monthLong(m.month),tipRows,nf(m.total),m.active);
    order.forEach(p=>{const v=m.byPlan[p].mrr; if(!v) return; const top=y(acc+v), bot=y(acc);
      bars+=`<rect x="${x(i)}" y="${top}" width="${barW}" height="${Math.max(0,bot-top-2)}" rx="${acc?0:0}" fill="${PLAN_COLOR[p]}"/>`; acc+=v;});
    bars+=`<rect x="${PL+bw*i}" y="${PT}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(tipHtml).replace(/"/g,'&quot;')}" style="cursor:crosshair"/>`;
    if(i%3===0||i===d.length-1) g+=`<text x="${x(i)+barW/2}" y="${H-16}" text-anchor="middle" font-size="12" fill="${C.ink2}">${monthLabel(m.month)}</text>`;
  });
  const peak=d.reduce((a,b)=>b.total>a.total?b:a,d[0]);
  const pi=d.indexOf(peak);
  const ann=peak.total?`<text x="${x(pi)+barW/2}" y="${y(peak.total)-8}" text-anchor="middle" font-size="12" font-family="IBM Plex Mono" fill="${C.ink}">${nf(peak.total)}</text>`:"";
  const svg1=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L.title}">${g}${bars}${ann}</svg>`;

  /* flows: new above the axis, churned below */
  const H2=170,P2=14,ih2=(H2-P2*2-20)/2, mid=P2+ih2+10;
  const fmax=Math.max(10,Math.ceil(Math.max(...d.map(m=>Math.max(m.newN,m.churned)))/10)*10);
  const fy=v=>(v/fmax)*ih2;
  let fl=`<line x1="${PL}" x2="${W-PR}" y1="${mid}" y2="${mid}" stroke="${C.rule2}"/>
    <text x="${PL-14}" y="${mid-ih2+4}" text-anchor="end" font-size="11.5" font-family="IBM Plex Mono" fill="${C.ink3}">+${fmax}</text>
    <text x="${PL-14}" y="${mid+ih2+4}" text-anchor="end" font-size="11.5" font-family="IBM Plex Mono" fill="${C.ink3}">−${fmax}</text>
    <text x="${W-PR}" y="${mid-ih2-2}" text-anchor="end" font-size="11" font-family="IBM Plex Mono" fill="${C.ink3}" letter-spacing="1.2">${L.new.toUpperCase()}</text>
    <text x="${W-PR}" y="${mid+ih2+16}" text-anchor="end" font-size="11" font-family="IBM Plex Mono" fill="${C.ink3}" letter-spacing="1.2">${L.churned.toUpperCase()}</text>`;
  d.forEach((m,i)=>{
    fl+=`<rect x="${x(i)}" y="${mid-fy(m.newN)}" width="${barW}" height="${fy(m.newN)}" fill="${C.s1}"/>
         <rect x="${x(i)}" y="${mid+1}" width="${barW}" height="${fy(m.churned)}" fill="${C.ink3}"/>
         <rect x="${PL+bw*i}" y="${P2}" width="${bw}" height="${H2-P2*2}" fill="transparent" data-tip="${esc(t().tip_flow(monthLong(m.month),m.newN,m.churned)).replace(/"/g,'&quot;')}" style="cursor:crosshair"/>`;
  });
  const svg2=`<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="${L.new} / ${L.churned}">${fl}</svg>`;

  return figure({id:"mrr",title:L.title,sub:L.sub,

function chartCohort(rows){

  const col=p=>{ // sequential: one hue, light -> dark
    const a=[0xE6,0xF1,0xEB], b=[0x0F,0x5A,0x3B], k=Math.max(0,Math.min(1,p/100));
    const m=(i)=>Math.round(a[i]+(b[i]-a[i])*k); return `rgb(${m(0)},${m(1)},${m(2)})`; };
  let g=`<text x="${PL-14}" y="${PT-14}" text-anchor="end" font-size="11" font-family="IBM Plex Mono" fill="${C.ink3}" letter-spacing="1.2">${L.cohort.toUpperCase()}</text>`;
  for(let k=0;k<cols;k++) g+=`<text x="${PL+cw*k+cw/2}" y="${PT-12}" text-anchor="middle" font-size="11.5" font-family="IBM Plex Mono" fill="${C.ink3}">+${k}</text>`;
  d.forEach((c,r)=>{
    const y=PT+r*rh;
    g+=`<text x="${PL-14}" y="${y+rh/2+4}" text-anchor="end" font-size="12.5" fill="${C.ink}">${monthLabel(c.cohort)}</text>
        <text x="${PL-14}" y="${y+rh/2+17}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono" fill="${C.ink3}">n=${c.size}</text>`;
    c.ks.forEach(kk=>{
      const dark=kk.pct>58;
      g+=`<rect x="${PL+cw*kk.k+1}" y="${y+1}" width="${cw-2}" height="${rh-2}" rx="3" fill="${col(kk.pct)}" data-tip="${esc(t().tip_cell(monthLong(c.cohort),kk.k,kk.alive,kk.size,pf(kk.pct,0).replace('%',''))).replace(/"/g,'&quot;')}"/>
          <text x="${PL+cw*kk.k+cw/2}" y="${y+rh/2+4}" text-anchor="middle" font-size="12" font-family="IBM Plex Mono" fill="${dark?'#fff':C.ink}" pointer-events="none">${Math.round(kk.pct)}</text>`;
    });
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L.title}">${g}</svg>`;
  return figure({id:"cohort",title:L.title,sub:L.sub,body:`<div class="chart">${svg}</div>${scrollHint()}`,
    legend:`<div class="legend"><span><i style="background:#E6F1EB;border:1px solid ${C.rule2}"></i>0 %</span><span><i style="background:#0F5A3B"></i>100 %</span><span style="color:${C.ink3}">${lang==='ru'?'значение в ячейке — % живых подписок':'cell value — % of subscriptions alive'}</span></div>`,
    take:L.take,

    src:"mart_cohort_retention · cohort_month, month_num, retention_pct",sql:SQL.cohort});
}

/* ─────────────────────────── lineage ─────────────────────────── */
function lineageSection(){
  const L=t().lineage, layers=["source","staging","core","mart"];
  const nodes=D.lineage.nodes, edges=D.lineage.edges;
  const byLayer={}; layers.forEach(l=>byLayer[l]=nodes.filter(n=>n.layer===l).sort((a,b)=>a.name.localeCompare(b.name)));
  const colW=(W-40)/4, nodeW=176, nodeH=44, gapY=18, PT=44;
  const rowsMax=Math.max(...layers.map(l=>byLayer[l].length));
  const H=PT+rowsMax*(nodeH+gapY)+10;
  const pos={};
  layers.forEach((l,ci)=>{const list=byLayer[l]; const totalH=list.length*nodeH+(list.length-1)*gapY; const y0=PT+(rowsMax*(nodeH+gapY)-gapY-totalH)/2;
    list.forEach((n,ri)=>pos[n.id]={x:20+ci*colW+(colW-nodeW)/2,y:y0+ri*(nodeH+gapY),n});});
  let g=layers.map((l,ci)=>`<text class="colhead" x="${20+ci*colW+colW/2}" y="20" text-anchor="middle">${L.cols[l].toUpperCase()}</text>`).join("");
  edges.forEach(([a,b])=>{const A=pos[a],B=pos[b]; if(!A||!B) return; const x1=A.x+nodeW,y1=A.y+nodeH/2,x2=B.x,y2=B.y+nodeH/2,mx=(x1+x2)/2;
    g+=`<path class="edge" data-a="${a}" data-b="${b}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;});
  Object.values(pos).forEach(({x,y,n})=>{
    const href=n.layer==="source"?`./dbt/#!/source/source.analytics_project.saas_raw.${n.name}`:`./dbt/#!/model/model.analytics_project.${n.name}`;
    g+=`<a class="node" data-id="${n.id}" href="${href}" target="_blank" rel="noopener"><rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="6"/>
        <text x="${x+12}" y="${y+19}">${n.name}</text>
        <text class="lay" x="${x+12}" y="${y+34}">${n.layer==="source"?"SEED / SOURCE":n.layer==="staging"?"VIEW":"TABLE"}${n.tests?` · ${L.tests(n.tests).toUpperCase()}`:""}</text></a>`;});
  return `<section class="sec" id="s-lineage">
    <div class="sec-head"><h2>${t().sec.lineage}</h2><span class="line"></span><span class="model">dbt manifest.json</span></div>
    <figure><figcaption><h3>${L.title}</h3><p class="sub">${L.sub}</p></figcaption>
      <div class="chart"><svg class="lin" id="lin" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L.title}">${g}</svg></div>${scrollHint()}
      <p class="lin-note">${L.note}</p>
    </figure></section>`;
}
function upstream(model){
  const target="model."+model, seen=new Set([target]), q=[target];
  while(q.length){const cur=q.shift(); D.lineage.edges.forEach(([a,b])=>{if(b===cur&&!seen.has(a)){seen.add(a);q.push(a);}});}
  return seen;
}
function wireLineage(){
  const lin=document.getElementById("lin"); if(!lin) return;
  const clear=()=>{lin.classList.remove("focus");lin.querySelectorAll(".lit").forEach(e=>e.classList.remove("lit"));};
  const focus=model=>{clear(); const set=upstream(model); lin.classList.add("focus");
    lin.querySelectorAll(".node").forEach(n=>{if(set.has(n.dataset.id)) n.classList.add("lit");});
    lin.querySelectorAll(".edge").forEach(e=>{if(set.has(e.dataset.a)&&set.has(e.dataset.b)) e.classList.add("lit");});};
  document.querySelectorAll(".sec[data-chart]").forEach(sec=>{
    const model=D.charts[sec.dataset.chart]; if(!model) return;
    sec.addEventListener("pointerenter",()=>focus(model)); sec.addEventListener("pointerleave",clear);
    sec.addEventListener("focusin",()=>focus(model)); sec.addEventListener("focusout",clear);
  });
  lin.querySelectorAll(".node").forEach(n=>{n.addEventListener("pointerenter",()=>{const id=n.dataset.id; if(id.startsWith("model.")) focus(id.slice(6));}); n.addEventListener("pointerleave",clear);});
}

/* ─────────────────────────── quality ─────────────────────────── */
function qualitySection(){
  const L=t().quality, Q=D.quality, lb=Q.last_build;
  const groups={}; Q.tests.forEach(x=>{(groups[x.model]=groups[x.model]||[]).push(x);});
  const order=["stg_saas_users","stg_subscriptions","dim_subscribers","fct_subscriptions","mart_mrr_monthly","mart_cohort_retention","mart_ltv","mart_rfm_segments"];
  const models=Object.keys(groups).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0)));
  const label=x=>{const s=(x.short||x.name).replace(/^dbt_utils_/,"").replace(/^elementary_/,""); return x.column?`${s} <span class="mono">&#8239;${x.column}</span>`:s;};
  const tests=models.map(m=>`<div class="grp"><div class="mname">${m}<span>${groups[m].length} ${L.tests_n}</span></div><ul>${
    groups[m].map(x=>`<li><span class="dot ${x.status==='pass'?'pass':x.status==='warn'?'warn':'fail'}"></span>${label(x)}</li>`).join("")}</ul></div>`).join("");
  const hist=Q.history, hw=W, hh=70, bw=Math.min(28,(hw-PL-PR)/Math.max(hist.length,1)*0.7), hmax=Math.max(...hist.map(h=>h.pass+h.fail));
  let hs=""; hist.forEach((h,i)=>{const x=PL+i*((hw-PL-PR)/hist.length), hgt=(h.pass/hmax)*44, fh=(h.fail/hmax)*44;
    hs+=`<rect x="${x}" y="${50-hgt}" width="${bw}" height="${hgt}" rx="3" fill="${C.s1}" data-tip="<b>${h.date}</b><br>${h.pass} ${L.pass}${h.fail?` · ${h.fail} ${L.fail}`:''}"/>${fh?`<rect x="${x}" y="${50-hgt-fh}" width="${bw}" height="${fh}" fill="${C.s3}"/>`:""}
         <text x="${x+bw/2}" y="${66}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono" fill="${C.ink3}">${h.date.slice(5)}</text>
         <text x="${x+bw/2}" y="${46-hgt}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono" fill="${C.ink2}">${h.pass}</text>`;});
  return `<section class="sec" id="s-quality">
    <div class="sec-head"><h2>${t().sec.quality}</h2><span class="line"></span><span class="model">elementary · dbt_invocations, elementary_test_results</span></div>
    <figure><figcaption><h3>${L.title}</h3><p class="sub">${L.sub}</p></figcaption>
      <div class="qgrid">
        <div class="qcard">
          <div class="mono" style="font-size:11px;letter-spacing:.14em;color:var(--ink-3)">DBT BUILD · ${lb.pass+lb.warn+lb.fail+lb.error} ${L.tests_n.toUpperCase()}</div>
          <div class="big">${lb.pass}<small>${L.pass}</small></div>
          <div class="row"><span>${L.fail}</span><span class="mono">${lb.fail+lb.error}</span></div>
          <div class="row"><span>${L.warn}</span><span class="mono">${lb.warn}</span></div>
          <div class="row"><span>${L.started}</span><span class="mono">${lb.started_at.slice(0,16)} UTC</span></div>
          <div class="row"><span>${L.target}</span><span class="mono">dev · duckdb</span></div>
          <div class="row"><span>invocation</span><span class="mono" title="${lb.invocation_id}">${lb.invocation_id.slice(0,8)}</span></div>
        </div>
        <div class="tests">${tests}</div>
      </div>
      <div class="hist"><div class="mono" style="font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin:22px 0 4px">${L.hist.toUpperCase()} · ${L.hist_sub}</div>
        <div class="chart"><svg viewBox="0 0 ${hw} ${hh}" role="img" aria-label="${L.hist}">${hs}</svg></div></div>
      <div class="take"><span class="tag">${lang==='ru'?'Что проверяется':'What is tested'}</span><p>${L.take}</p></div>
    </figure></section>`;
}

let io;
function observe(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll(".toc a")];
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#"+e.target.id));}});},{rootMargin:"-10% 0px -70% 0px"});
  document.querySelectorAll(".sec").forEach(s=>io.observe(s));
}
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(chip){const k=chip.dataset.k,v=chip.dataset.v; F[k].has(v)?F[k].delete(v):F[k].add(v); render(); return;}
  if(e.target.closest("#reset")){Object.values(F).forEach(s=>s.clear()); render(); return;}
  const lb=e.target.closest(".lang button"); if(lb){lang=lb.dataset.lang; try{localStorage.setItem('dash-lang',lang);}catch(err){} renderStatic(); render(); return;}
  const sw=e.target.closest("#sqlToggle"); if(sw){const on=sw.getAttribute("aria-pressed")!=="true"; sw.setAttribute("aria-pressed",String(on)); document.querySelectorAll("details[data-sql]").forEach(d=>d.open=on); return;}
});
renderStatic(); render();
</script>
</body>
</html>
