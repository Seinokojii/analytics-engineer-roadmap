version: 2

sources:
  - name: raw
    description: "Сырые данные из операционной БД"
    schema: main

    # Проверка свежести — dbt source freshness
    freshness:
      warn_after:  {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: created_at

    tables:
      - name: orders
        description: "Сырые заказы из CRM"
        columns:
          - name: order_id
            description: "Первичный ключ"
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: total_amount
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 10000000
          - name: channel
            tests:
              - accepted_values:
                  values: ['web', 'mobile', 'email', 'unknown', null]
          - name: status
            tests:
              - accepted_values:
                  values: ['completed', 'pending', 'cancelled', 'refunded']

      - name: customers
        description: "Справочник клиентов"
        columns:
          - name: customer_id
            tests:
              - not_null
              - unique
          - name: email
            tests:
              - not_null
