version: 2
exposures:
  - name: sales_performance_dashboard
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/reports/sales-performance
    description: Дашборд эффективности продаж.
    depends_on:
      - ref('fct_orders_enriched')
      - ref('monthly_channel_pivot')
      - ref('dim_date')
    owner:
      name: Analytics Team
      email: analytics@company.com

  - name: customer_retention_report
    type: analysis
    maturity: medium
    description: Еженедельный отчёт по retention и churn.
    depends_on:
      - ref('fct_orders_enriched')
      - ref('fct_orders_surrogate')
    owner:
      name: Growth Team
      email: growth@company.com

  - name: finance_monthly_close
    type: ml
    maturity: low
    description: Данные для финансового закрытия месяца.
    depends_on:
      - ref('fct_orders_enriched')
      - ref('monthly_channel_pivot')
    owner:
      name: Finance Team
      email: finance@company.com

  # Days 101-104: API chitaet Gold-tablitsy po imeni skhemy, mimo ref().
  # Poka exposure ne bylo, perenos marts iz main v Gold nichego by
  # ne pokazal v lineage - a API tikho chital by protukhshie kopii.
  - name: metrics_api
    type: application
    maturity: medium
    url: http://localhost:8000/docs
    description: FastAPI metrics_api/main.py — /metrics/summary, /by-city, /ltv-report.
    depends_on:
      - ref('fct_orders')
      - ref('dim_customers')
    owner:
      name: Analytics Team
      email: analytics@company.com
