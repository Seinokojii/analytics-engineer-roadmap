version: 2

sources:
  - name: raw
    description: "Сырые данные из операционной БД"
    schema: main

    tables:
      - name: raw_orders
        identifier: raw_orders
        description: "Сырые заказы из CRM"
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: user_id
            data_tests: [not_null]
          - name: amount
            data_tests: [not_null]

      - name: raw_customers
        identifier: raw_customers
        description: "Справочник клиентов"
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: updated_at
            data_tests: [not_null]
