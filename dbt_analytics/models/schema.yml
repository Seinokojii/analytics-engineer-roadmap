version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed']
      - name: amount
        tests:
          - not_null

  - name: fct_orders_enriched
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: revenue_tier
        tests:
          - accepted_values:
              values: ['zero', 'low', 'medium', 'high', 'vip']

  - name: dim_customers
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: total_spent
        tests:
          - not_null