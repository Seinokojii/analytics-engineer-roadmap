name: 'analytics_project'
version: '1.0.0'
config-version: 2

profile: 'analytics'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["data"]
test-paths: ["tests"]

# Day 86-88: Elementary ne imeet duckdb__ realizatsiy chasti makrosov.
# search_order zastavlyaet dbt snachala iskat makros v nashem proekte,
# i tolko potom v pakete. Sm. macros/duckdb_elementary_shims.sql
dispatch:
  - macro_namespace: elementary
    search_order: ['analytics_project', 'elementary']

# Days 101-104: Medallion Architecture.
# Papki ostayutsya dbt-sloyami (staging / marts), skhemy stanovyatsya
# Medallion-sloyami. Svyaz papka -> skhema zadana tolko zdes, v odnom meste:
#   Bronze = seeds + sources + snapshots  -> skhema zagruzchika, dbt ee ne perestraivaet
#   Silver = staging                      -> <target>_silver (prod: SILVER)
#   Gold   = marts + metrics              -> <target>_gold   (prod: GOLD)
# Imya skhemy sobiraet macros/generate_schema_name.sql.
models:
  analytics_project:
    staging:
      +materialized: view
      +schema: silver
      +tags: ['silver']
    marts:
      +materialized: table
      +schema: gold
      +tags: ['gold']
      # Snowflake-only modeli dney 76-80 (stg_airbyte_*, fct_orders_incremental,
      # fct_orders_append, dim_customers_clustered) vyklyucheny vne Snowflake
      # v config() samoy modeli: enabled=target.type == 'snowflake'.
      # Ne zdes: JSON-skhema dbt_project.yml (SchemaStore -> VS Code) zhdet
      # u +enabled boolean, a ne Jinja-stroku, i podsvechivaet oshibku.
      # Na DuckDB oni ne sobiralis i do perestroyki - 5 ERROR na polnom
      # dbt run. Tri padayut na dialekte (dateadd, _airbyte_data:path), dve -
      # na nesovpadenii kolonok so stg_orders / stg_users.
    metrics:
      +schema: gold
      +tags: ['gold']

  # Day 86-88: sluzhebnye modeli Elementary v otdelnoy sheme
  elementary:
    +schema: elementary

seeds:
  analytics_project:
    +tags: ['bronze']

# Snapshot - istoriya, kotoruyu ne peresobrat. snap_customers i
# snap_orders_status snimayut syrye tablitsy -> Bronze.
# snap_subscribers snimaet Gold-vitrinu dim_subscribers: eto istoriya
# vitriny, a ne istochnika. Kontrakt schitaet ego Gold, inache
# rebro gold -> bronze vyglyadit kak potok protiv techeniya.
snapshots:
  analytics_project:
    snap_customers:
      +tags: ['bronze']
    snap_orders_status:
      +tags: ['bronze']
    snap_subscribers:
      +tags: ['gold']
